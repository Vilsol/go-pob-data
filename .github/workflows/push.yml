name: push

permissions: read-all

on: [push, pull_request]

env:
  GO_VERSION: "1.23.3"
  LFS_INCLUDE: "data/**/*.msgpack.br,data/**/*.json.gz,data/**/files/**,treegen/testdata/*.gz"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      # imagick.v3 needs ImageMagick 7, which Ubuntu does not package
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Lint
        run: nix-shell --run 'go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout 5m'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: List LFS artifacts
        run: git lfs ls-files -l -I "$LFS_INCLUDE" | cut -d' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS artifacts
        run: git lfs pull --include "$LFS_INCLUDE"

      # The extractor and treegen tests read the live patch's bundles from the patch CDN; the
      # cache holds them per patch, so only the first run after a patch downloads them.
      - name: Resolve live patch
        run: echo "POE_PATCH=$(curl -fsSL https://raw.githubusercontent.com/poe-tool-dev/latest-patch-version/main/latest.txt)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-pob-data/bundles
          key: poe-bundles-${{ env.POE_PATCH }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Test
        run: nix-shell --run 'go test -v ./...'
