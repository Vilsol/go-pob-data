version: "2"
linters:
  default: none
  enable:
    - bidichk
    - contextcheck
    - durationcheck
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nonamedreturns
    - prealloc
    - revive
    - staticcheck
    - unused
    - whitespace
    - wrapcheck
  settings:
    staticcheck:
      checks:
        - all
        - -ST*
        - -QF*
    gocritic:
      disabled-checks:
        - ifElseChain
    govet:
      disable:
        - shadow
      enable-all: true
    wrapcheck:
      ignore-package-globs:
        - github.com/Vilsol/go-pob-data/*
        - golang.org/x/sync/errgroup*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Vilsol/go-pob-data)
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
