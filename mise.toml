[tools]
go = "1.26.11"
"aqua:golangci/golangci-lint" = "2.15.0"
"go:github.com/tinylib/msgp" = "1.6.4"
imagemagick = "7.1.2_27"

[tasks.test-artifacts]
description = "Check the tuple assets against their json.gz and the frozen map assets, the map assets against their pinned sha256, and the .min assets against their full assets and field lists (needs cgo)"
run = '''nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 go test -count=1 -run 'TestTupleMatchesJSON|TestTupleMatchesLegacy|TestLegacyAssetsPinned' . && go test -count=1 ./fields"'''

[tasks.reencode-artifacts]
description = "Write every missing or stale tuple asset of every committed version from its json.gz (needs cgo)"
run = "nix-shell -p gcc pkg-config imagemagick --run 'CGO_ENABLED=1 go test -count=1 -run TestTupleMatchesJSON . -update'"

[tasks.project-min]
description = "Write the .min assets of every version that has a field list (fields/<version>.json) from its committed full tuple assets"
run = "go run ./cmd/project"

[tasks.tree]
description = "Regenerate only data/<version>/tree from the patch CDN (defaults to the live patch)"
usage = 'arg "[patch]" help="Full patch version, e.g. 3.29.3.3"'
run = '''
patch="${usage_patch:-$(nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 go run . -latest")}"
nix-shell --run "CGO_ENABLED=1 go run . -tree-only cdn:$patch ${patch%.*.*}"
'''

[tasks.extract]
description = "Extract a game's live patch (or the given one) from the patch CDN into data/<version> (needs cgo)"
usage = '''
arg "[game]" help="poe1 or poe2" default="poe1"
arg "[patch]" help="Full patch version, e.g. 3.29.3.3 or 0.5.5.4.2 (defaults to the live patch)"
'''
run = '''
patch="${usage_patch:-$(nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 go run . -game ${usage_game} -latest")}"
nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 ./extract.sh cdn:$patch $(echo "$patch" | cut -d. -f1,2) ${usage_game}"
'''

[tasks.check-exe]
description = "Opt-in: compare the table layouts PoE1's client executable (downloaded from the patch CDN) loads against data/<version>/schema.min.json; fails when an exported table disagrees (needs cgo)"
usage = 'arg "[patch]" help="Full patch version, e.g. 3.30.0.1.2 (defaults to the live patch)"'
run = '''
patch="${usage_patch:-$(nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 go run . -latest")}"
nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 go run . -check-exe cdn:$patch $(echo "$patch" | cut -d. -f1,2)"
'''

[tasks.monster-varieties]
description = "Regenerate monster_varieties.txt, or monster_varieties_poe2.txt from PoB-PoE2 (the monsters whose .ot templates are published), from PoB's minion and spectre export templates"
usage = '''
arg "[pob]" help="Path of Building checkout" default="../PathOfBuilding"
arg "[game]" help="poe1 or poe2" default="poe1"
'''
run = '''
out=monster_varieties.txt
[ "${usage_game}" = poe2 ] && out=monster_varieties_poe2.txt
grep -h '^#\(monster\|spectre\) ' "${usage_pob}/src/Export/Minions/Minions.txt" "${usage_pob}/src/Export/Minions/Spectres.txt" | awk '{print $2}' | LC_ALL=C sort -u > "$out"
'''

[tasks.trade-stats]
description = "Fetch the trade site's stats list (the live league's) into data/<version>/files/api/trade[2]/data/stats.json and regenerate the manifests"
usage = '''
arg "<game>" help="poe1 or poe2"
arg "<version>" help="The data version of the game's live patch, e.g. 3.29 or 0.5"
'''
run = '''nix-shell -p gcc pkg-config imagemagick --run "CGO_ENABLED=1 go run . -game ${usage_game} -trade-stats ${usage_version}"'''
